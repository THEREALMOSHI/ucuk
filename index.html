<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Arieyna ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        .font-handwriting { font-family: 'Sacramento', cursive; }
        body { font-family: 'Poppins', sans-serif; }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .animate-float { animation: float 6s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-pink-200 to-rose-200 min-h-screen text-rose-950 flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Floating Hearts Container -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Floating Audio Control -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3">
        <button id="musicBtn" class="bg-white/90 backdrop-blur-md text-rose-600 border-2 border-rose-400 p-3.5 rounded-full shadow-lg hover:scale-105 transition flex items-center justify-center">
            <span id="musicIcon" class="text-xl">🎵</span>
        </button>
        <audio id="bgMusic" loop src="music.mp3"></audio>
    </div>

    <!-- Main Card Container -->
    <main class="relative z-10 bg-white/80 backdrop-blur-md max-w-xl w-full rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/50 text-center my-8">
        
        <h1 class="font-handwriting text-5xl sm:text-6xl text-rose-600 mb-2">Hi Arieyna! ❤️</h1>
        <p class="text-rose-700/80 text-sm sm:text-base mb-6">A little corner of the internet built just for you.</p>

        <!-- Carousel -->
        <section class="mb-8">
            <div class="relative w-full aspect-[4/3] rounded-2xl overflow-hidden shadow-md bg-rose-50">
                <div id="slideContainer" class="flex transition-transform duration-500 ease-out h-full w-full">
                    <!-- Slide 1 -->
                    <div class="min-w-full h-full relative">
                        <img src="https://images.unsplash.com/photo-1540807615429-35ff02b20707?w=800&h=600&fit=crop" class="w-full h-full object-cover" alt="Headsheet kiss">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-rose-950/80 to-transparent p-4 text-white text-sm">A tender forehead kiss</div>
                    </div>
                    <!-- Slide 2 -->
                    <div class="min-w-full h-full relative">
                        <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=800&h=600&fit=crop" class="w-full h-full object-cover" alt="Sunlight">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-rose-950/80 to-transparent p-4 text-white text-sm">Sunlit and inseparable</div>
                    </div>
                    <!-- Slide 3 -->
                    <div class="min-w-full h-full relative">
                        <img src="https://images.unsplash.com/photo-1525268771113-32d9e9021a97?w=800&h=600&fit=crop" class="w-full h-full object-cover" alt="Two people">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-rose-950/80 to-transparent p-4 text-white text-sm">The way you look at me</div>
                    </div>
                    <!-- Slide 4 -->
                    <div class="min-w-full h-full relative">
                        <img src="https://images.unsplash.com/photo-1514269481880-b9b4ac3b19f1?w=800&h=600&fit=crop" class="w-full h-full object-cover" alt="Warm embrace">
                        <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-rose-950/80 to-transparent p-4 text-white text-sm">Home is wherever you are</div>
                    </div>
                </div>

                <!-- Controls -->
                <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 text-rose-900 w-9 h-9 rounded-full flex items-center justify-center shadow hover:bg-white transition">❮</button>
                <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 text-rose-900 w-9 h-9 rounded-full flex items-center justify-center shadow hover:bg-white transition">❯</button>
            </div>
        </section>

        <!-- Reasons Section -->
        <section class="text-left bg-rose-50/60 p-5 rounded-2xl border border-rose-100 mb-6">
            <h2 class="text-lg font-semibold text-rose-800 mb-3 flex items-center gap-2">✨ Reasons why you're special</h2>
            <ul id="reasonsList" class="space-y-2.5 text-sm text-rose-900/90"></ul>
        </section>

    </main>

    <script>
        // Exact Reasons List from Figma code
        const REASONS = [
            "The way your eyes crinkle when you laugh for real",
            "How you make even ordinary days feel like something worth remembering",
            "Your ridiculous, perfect, completely contagious laugh",
            "The way you care — quietly, deeply, without making a show of it",
            "That you always know exactly what I need before I do",
            "Every single stupid inside joke we have built together",
            "How safe I feel just being next to you",
            "The fact that you exist, and somehow chose me"
        ];

        const listEl = document.getElementById('reasonsList');
        REASONS.forEach(reason => {
            const li = document.createElement('li');
            li.className = "flex items-start gap-2.5";
            li.innerHTML = `<span class="text-rose-500 mt-0.5">💖</span> <span>${reason}</span>`;
            listEl.appendChild(li);
        });

        // Carousel logic
        let index = 0;
        const total = 4;
        const slideContainer = document.getElementById('slideContainer');

        function updateSlide() {
            slideContainer.style.transform = `translateX(-${index * 100}%)`;
        }
        function nextSlide() { index = (index + 1) % total; updateSlide(); }
        function prevSlide() { index = (index - 1 + total) % total; updateSlide(); }

        // Audio logic
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');
        let playing = false;
        music.volume = 0.2;

        musicBtn.onclick = () => {
            if(playing) {
                music.pause();
                musicIcon.innerText = '🎵';
            } else {
                music.play().then(() => { musicIcon.innerText = '⏸️'; })
                .catch(() => alert('Add music.mp3 to your repo!'));
            }
            playing = !playing;
        };

        // Floating hearts
        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('span');
            heart.innerText = '💖';
            heart.className = 'absolute bottom-0 text-rose-400/30 animate-float';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 800);
    </script>
</body>
</html>
